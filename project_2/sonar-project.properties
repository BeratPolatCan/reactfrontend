# SonarQube Cloud (sonarcloud.io) yapilandirmasi.
# Token BURADA DEGIL: CI'da SONAR_TOKEN secret'indan okunur.

sonar.projectKey=BeratPolatCan_reactfrontend
sonar.organization=beratpolatcan

# Yollar bu dosyaya (project_2/) gore goreceli; workflow'da projectBaseDir=project_2
# verildigi icin tarayici buradan baslar.
sonar.sources=src

# Test dosyalari da src icinde durdugu icin ayni koku gosterip hangilerinin test
# oldugunu ayrica belirtiyoruz. Boylece Sonar onlari "urun kodu" sanip
# coverage'ini dusuk gostermez ve kurallari test kodu icin gevsetir.
sonar.tests=src
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx

# Coverage'i Vitest (v8 provider) uretir, Sonar sadece OKUR.
# Bu yol yanlis olursa Sonar hata vermez, sessizce %0 coverage gosterir.
sonar.javascript.lcov.reportPaths=coverage/lcov.info
